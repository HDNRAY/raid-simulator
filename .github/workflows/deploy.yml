name: Deploy to GitHub Pages

# 与 bdgame / colorGuess 一致的发布方式：
#   在 raid-simulator 仓库里构建，然后把产物推到 HDNRAY.github.io 仓库的 raid/ 子目录。
#   线上地址 https://hdnray.github.io/raid/ 保持不变。
#
# 依赖仓库 secret：SSH_DEPLOY_KEY
#   配置步骤见 docs/setup-deploy-key.md
#
# 新项目尚未就绪时（src/main.ts 不存在），本 workflow 只做校验不做发布，
#   这样不会用空产物覆盖线上内容。

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 新项目就绪判定：有构建入口才算就绪
      - name: Detect project
        id: detect
        run: |
          if [ -f src/main.ts ] || [ -f src/main.tsx ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Not ready yet
        if: steps.detect.outputs.ready == 'false'
        run: |
          echo "::notice title=Sketch stage::src/main.ts not found. \
          Design/docs-only commit; skipping build and deploy. \
          Live site at https://hdnray.github.io/raid/ is left untouched."

      # ---------- 新项目 ----------
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run typecheck

      - name: Lint (enforces core/ purity constraints)
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run lint

      - name: Test (unit + golden replay + content validation)
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run test -- --run

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run build

      # hash 路由下用于兜底未知路径；.nojekyll 让 Pages 跳过 Jekyll 处理
      - name: Add Pages extras
        if: steps.detect.outputs.ready == 'true'
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Push to github pages
        if: steps.detect.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: dist
          destination-github-username: HDNRAY
          destination-repository-name: HDNRAY.github.io
          user-email: 110681032@qq.com
          target-directory: raid
          commit-message: Update from raid-simulator
