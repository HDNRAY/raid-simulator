name: Deploy to GitHub Pages

# 与 bdgame / colorGuess 一致的发布方式：
#   在 raid-simulator 仓库里构建，然后把产物推到 HDNRAY.github.io 仓库的 raid/ 子目录。
#   线上地址 https://hdnray.github.io/raid/ 保持不变。
#
# 需要的仓库 secret：SSH_DEPLOY_KEY（与 bdgame / colorGuess 用的是同一对部署密钥）
#
# 过渡期：新项目还没有构建入口（src/main.ts）时，自动改为构建 archive/ 里的旧版本，
# 保证推送不会让线上站点失效。src/main.ts 一出现就自动切换到构建新项目。

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # 判断新项目是否已有构建入口；没有则退回构建 archive/
      - name: Detect project
        id: detect
        run: |
          if [ -f src/main.ts ] || [ -f src/main.tsx ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # ---------- 旧版本（archive/）：保证 /raid/ 在任何时候都有内容 ----------
      # archive/package.json 里 homepage 是 "."，CRA 会产出相对路径（./static/...），
      # 所以放在 /raid/ 下不需要任何 PUBLIC_URL 覆盖。
      - name: Build archive (legacy v1)
        if: steps.detect.outputs.ready == 'false'
        working-directory: archive
        run: |
          npm install --no-audit --no-fund
          npm run build
          cp build/index.html build/404.html
          touch build/.nojekyll

      - name: Point dist at archive output
        if: steps.detect.outputs.ready == 'false'
        run: |
          rm -rf dist
          mv archive/build dist

      # ---------- 新项目 ----------
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          version: 9

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        if: steps.detect.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run typecheck

      - name: Lint (enforces core/ purity constraints)
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run lint

      - name: Test (unit + golden replay + content validation)
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run test -- --run

      - name: Build
        if: steps.detect.outputs.ready == 'true'
        run: pnpm run build

      - name: Add Pages extras
        if: steps.detect.outputs.ready == 'true'
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Push to github pages
        if: github.event_name != 'pull_request'
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: dist
          destination-github-username: HDNRAY
          destination-repository-name: HDNRAY.github.io
          user-email: 110681032@qq.com
          target-directory: raid
          commit-message: Update from raid-simulator
